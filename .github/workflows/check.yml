name: Observatory checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/model.test.mjs
      - run: node --check server/main.mjs
      - run: node --check server/collector.mjs
      - run: node --check public/app.js
      - name: Build Linux image
        if: runner.os == 'Linux'
        run: docker build -t gta-observatory:ci .
